<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Wiggleroom</title>
<style>
  :root{--bg:#fffdf8;--fg:#1a1916;--mut:#726f67;--line:#e9e4da;--soft:#f6f2ea;--acc:#c45a3a;--ok:#3f7d5a;--warn:#b5751a;--hot:#c0392b}
  @media(prefers-color-scheme:dark){:root{--bg:#1e1d1a;--fg:#ece9e2;--mut:#9a968c;--line:#34322c;--soft:#171614}}
  *{box-sizing:border-box}body{margin:0;width:340px;background:var(--bg);color:var(--fg);font:13px/1.45 Inter,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
  .mark{width:24px;height:24px;border-radius:7px;background:linear-gradient(140deg,#e07a52,#c45a3a);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
  header b{font-size:14px}header .mut{margin-left:auto;font-size:11px}
  .mut{color:var(--mut)}main{padding:12px 14px}
  .row{display:flex;align-items:center;gap:8px;margin:6px 0}.row>span:first-child{width:96px;color:var(--mut);flex:none;font-size:12px}.track{flex:1;height:8px;border-radius:5px;background:var(--line);overflow:hidden}.track>span{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#4caf6a,#2e8b57)}.track.mid>span{background:linear-gradient(90deg,#e07a52,#c45a3a)}.track.warn>span{background:linear-gradient(90deg,#e0a048,#b5751a)}.track.hot>span{background:linear-gradient(90deg,#e06a55,#c0392b)}.row b{width:44px;text-align:right}
  .sub{margin:-3px 0 8px 104px;font-size:11px;color:var(--mut)}
  h5{margin:12px 0 6px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
  .tip{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin:8px 0;font-size:12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
  button{border:1px solid var(--line);background:var(--soft);color:var(--fg);border-radius:9px;padding:7px 9px;font:600 12px Inter,sans-serif;cursor:pointer}button:hover{border-color:var(--acc)}button.primary{background:var(--acc);border-color:var(--acc);color:#fff}button.w{grid-column:1/3}
  canvas{width:100%;height:56px;display:block;margin-top:4px}
  .err{color:var(--hot);font-size:12px}
  footer{padding:8px 14px 12px;font-size:11px;color:var(--mut);border-top:1px solid var(--line);display:flex;gap:10px}footer a{color:var(--acc);text-decoration:none}
</style>
</head>
<body>
<header><span class="mark">W</span><b>Wiggleroom</b><span class="mut" id="upd">—</span></header>
<main>
  <div id="err" class="err" hidden></div>
  <div class="row"><span>5-hour window</span><div class="track" id="tS"><span></span></div><b id="vS">—</b></div><div class="sub" id="rS"></div>
  <div class="row"><span>Weekly limit</span><div class="track" id="tW"><span></span></div><b id="vW">—</b></div><div class="sub" id="rW"></div>
  <div id="models"></div>
  <h5>Weekly pace</h5><div id="pace" class="mut">Collecting readings…</div><canvas id="spark" width="620" height="112"></canvas>
  <div class="grid">
    <button class="primary" id="open">Open Claude</button><button id="refresh">Refresh</button>
    <button id="backup">Back up chats…</button><button id="local">Local Claude Code…</button>
    <button class="w" id="show">Show the bar on claude.ai</button>
  </div>
</main>
<footer><a href="https://claude.ai/settings/usage" target="_blank">Claude's usage page</a><span>·</span><span>v<span id="ver"></span></span><span>·</span><span>Local only</span></footer>
<script src="usage.js"></script><script src="popup.js"></script>
</body>
</html>
