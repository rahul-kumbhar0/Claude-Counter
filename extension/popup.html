<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Wiggleroom</title>
<style>
  :root{--bg:#fffdf8;--fg:#1a1916;--mut:#726f67;--line:#e9e4da;--soft:#f6f2ea;--acc:#c45a3a;--ok:#3f7d5a;--warn:#b5751a;--hot:#c0392b}
  @media(prefers-color-scheme:dark){:root{--bg:#1e1d1a;--fg:#ece9e2;--mut:#9a968c;--line:#34322c;--soft:#171614}}
  *{box-sizing:border-box}html,body{margin:0}body{width:400px;height:580px;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:13px/1.45 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  header{display:flex;align-items:center;gap:8px;padding:11px 14px 0;flex:none}
  .mark{width:24px;height:24px;border-radius:7px;background:linear-gradient(140deg,#e07a52,#c45a3a);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
  header b{font-size:14px}header .upd{margin-left:auto;font-size:11px;color:var(--mut)}
  .tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line);flex:none}
  .tab{border:none;background:none;color:var(--mut);font:600 12px Inter,sans-serif;padding:8px 9px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:6px 6px 0 0}.tab.on{color:var(--acc);border-color:var(--acc)}.tab:hover{color:var(--fg)}
  main{flex:1;min-height:0;overflow:auto;padding:12px 14px 14px}
  .mut{color:var(--mut)}.tiny{font-size:11px;color:var(--mut)}
  h5{margin:12px 0 6px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}h5:first-child{margin-top:0}
  .row{display:flex;align-items:center;gap:8px;margin:6px 0}.row>span:first-child{width:104px;color:var(--mut);flex:none;font-size:12px}.track{flex:1;height:8px;border-radius:5px;background:var(--line);overflow:hidden}.track>span{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#4caf6a,#2e8b57);transition:width .4s}.track.mid>span{background:linear-gradient(90deg,#e07a52,#c45a3a)}.track.warn>span{background:linear-gradient(90deg,#e0a048,#b5751a)}.track.hot>span{background:linear-gradient(90deg,#e06a55,#c0392b)}.row b{width:44px;text-align:right}
  .sub{margin:-3px 0 8px 112px;font-size:11px;color:var(--mut)}
  .tip{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin:8px 0;font-size:12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  button{border:1px solid var(--line);background:var(--soft);color:var(--fg);border-radius:9px;padding:8px 9px;font:600 12px Inter,sans-serif;cursor:pointer;text-align:center}button:hover{border-color:var(--acc)}button.primary{background:var(--acc);border-color:var(--acc);color:#fff}button.w{width:100%;margin-top:6px}button.sm{padding:4px 8px;font-size:11.5px}button:disabled{opacity:.5;cursor:not-allowed}
  canvas{width:100%;height:56px;display:block;margin-top:4px}
  .err{color:var(--hot);font-size:12px;margin-bottom:8px}
  .st{margin-top:8px;font-size:11.5px;color:var(--mut);word-break:break-word;min-height:16px}.prog{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}.prog>span{display:block;height:100%;width:0;background:var(--acc)}
  .opt{display:flex;gap:8px;align-items:center;margin:7px 0;cursor:pointer;font-size:12.5px}.opt input{margin:0}
  input[type=text],input[type=number],textarea,select{width:100%;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:inherit;font:12.5px Inter,sans-serif;margin-top:5px}textarea{min-height:60px;resize:vertical;font-family:ui-monospace,Menlo,monospace}input[type=number]{width:72px;margin:0}select{width:auto;margin:0}
  .pitem{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:6px 9px;margin-top:6px}.pitem .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kbd{font-family:ui-monospace,Menlo,monospace;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
  .stat2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.stat2 div{border:1px solid var(--line);border-radius:10px;padding:8px 10px}.stat2 b{display:block;font-size:18px;letter-spacing:-.02em}.stat2 span{font-size:11px;color:var(--mut)}
  footer{padding:8px 14px 10px;font-size:11px;color:var(--mut);border-top:1px solid var(--line);display:flex;gap:10px;flex:none}footer a{color:var(--acc);text-decoration:none}
  a{color:var(--acc)}
</style>
</head>
<body>
<header><span class="mark">W</span><b>Wiggleroom</b><span class="upd" id="upd">—</span></header>
<div class="tabs"><button class="tab on" data-t="usage">Usage</button><button class="tab" data-t="actions">Actions</button><button class="tab" data-t="prompts">Prompts</button><button class="tab" data-t="settings">Settings</button><button class="tab" data-t="about">About</button></div>
<main id="main"></main>
<footer><a href="https://claude.ai/settings/usage" target="_blank">Claude's usage page</a><span>·</span><span>v<span id="ver"></span></span><span>·</span><span>Local only</span></footer>
<script src="usage.js"></script><script src="popup.js"></script>
</body>
</html>
